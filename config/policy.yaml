# AURA Policy Configuration
# Version: 1.0.0

policy_version: "1.0.0"

# Enforcement Mode:
# "enforce"   - Standard security mode: enforces BLOCK and APPROVAL
# "permissive" - Monitor / Audit-only mode: allows all actions through while auditing findings
enforcement_mode: "enforce"

# Deterministic policy rules (evaluated in order)
rules:
  - id: "RULE_AGENT_AUTH"
    description: "Verify agent is authenticated and authorized"
    enabled: true
    priority: 10

  - id: "RULE_RESOURCE_ACCESS"
    description: "Verify resource exists and agent has access"
    enabled: true
    priority: 20

  - id: "RULE_CONFIDENTIAL_EGRESS"
    description: "Block confidential data sent to external destinations"
    enabled: true
    priority: 30

  - id: "RULE_SENSITIVE_OPS"
    description: "Require approval for sensitive operations"
    enabled: true
    priority: 40

  - id: "RULE_DESTINATION_RESTRICT"
    description: "Restrict destinations based on data sensitivity"
    enabled: true
    priority: 50

  - id: "RULE_EXECUTION_CONSTRAINTS"
    description: "Enforce execution constraints (size, rate, format)"
    enabled: true
    priority: 60

# Sensitive operations that require human approval
sensitive_operations:
  - "send_email"
  - "call_api"
  - "run_query"

# Operations that always require approval regardless of other rules
always_require_approval:
  - tool: "call_api"
    operations: ["delete", "update_permissions"]

# External domain blocklist
blocked_destinations:
  - "competitor.com"
  - "untrusted-external.com"
  - "leak-site.org"

# Allowed external domains (allowlist mode for email)
allowed_email_domains:
  - "company.com"
  - "partner.org"
  - "trusted-vendor.com"

# Internal domains
internal_domains:
  - "company.com"
  - "internal.company.com"

# Maximum request size in bytes
max_request_size_bytes: 1048576  # 1 MB

# Maximum parameter value length
max_param_value_length: 10000

# JEV configuration
jev:
  enabled: true
  timeout_seconds: 5
  max_attempts: 2
  max_context_tokens: 4096
  provider: "openrouter"  # "mock", "gemini", "openrouter"
  model: "google/gemini-2.5-flash"

# Taint tracking
taint:
  enabled: true
  confidential_sensitivity_levels:
    - "CONFIDENTIAL"
    - "TOP_SECRET"

