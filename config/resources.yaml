# AURA Resource Registry Configuration
# Trusted source for resource existence and sensitivity classification.
version: "1.0"

resources:
  # ── Public files ──
  public/readme:
    sensitivity: public
    resource_type: file
    description: "Public README document"

  public/faq:
    sensitivity: public
    resource_type: file
    description: "Public FAQ document"

  # ── Internal files ──
  internal/report_q4:
    sensitivity: internal
    resource_type: file
    description: "Internal quarterly report"

  internal/roadmap:
    sensitivity: internal
    resource_type: file
    description: "Internal product roadmap"

  # ── Confidential files ──
  confidential/hr_records:
    sensitivity: confidential
    resource_type: file
    description: "HR employee records — contains PII"

  confidential/financial_data:
    sensitivity: confidential
    resource_type: file
    description: "Financial data — restricted access"

  # ── Queries ──
  reports/monthly_summary:
    sensitivity: internal
    resource_type: query
    description: "Monthly summary report query"

  analytics/user_stats:
    sensitivity: internal
    resource_type: query
    description: "User statistics analytics query"

  # ── API operations ──
  api/public_status:
    sensitivity: public
    resource_type: api
    description: "Public API health check"

  api/internal_deploy:
    sensitivity: confidential
    resource_type: api
    description: "Internal deployment trigger — sensitive"

  # ── Customer Refund & Multimodal Case Evidence ──
  photo-5521.jpg:
    sensitivity: public
    resource_type: image
    description: "Customer photo evidence showing damaged blender"

  invoice-8834.pdf:
    sensitivity: internal
    resource_type: document
    description: "Customer invoice PDF for order ORD-9921"

  voice-2210.mp3:
    sensitivity: internal
    resource_type: audio
    description: "Customer voice recording describing broken blender"

  ORD-9921:
    sensitivity: internal
    resource_type: order
    description: "Authoritative customer order record for Vortex Blender Pro 9000"

  ORD-1002:
    sensitivity: internal
    resource_type: order
    description: "Authoritative customer order record for Espresso Master 200"

  # ── Meeting Room Resources ──
  rooms/maple:
    sensitivity: internal
    resource_type: room
    description: "Maple Conference Room (Cap: 6, AV/Whiteboard, $40/hr)"

  rooms/oak:
    sensitivity: internal
    resource_type: room
    description: "Oak Executive Suite (Cap: 4, Video Conf, $65/hr)"

  rooms/pine:
    sensitivity: internal
    resource_type: room
    description: "Pine Huddle Room (Cap: 4, Whiteboard, $35/hr)"

