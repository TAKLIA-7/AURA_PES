# AURA Agent Registry and RBAC Configuration
# Agent identities and roles are TRUSTED — assigned by the gateway, never self-declared.

agents:
  admin_agent:
    id: "admin_agent"
    role: "admin"
    description: "Performs explicitly permitted administrative operations"
    allowed_tools:
      - "read_file"
      - "run_query"
      - "call_api"
      - "send_email"
    allowed_resources:
      - "doc:*"
      - "db:*"
      - "api:admin"
      - "api:*"
      - "confidential/*"
      - "public/*"
      - "internal/*"
      - "*"
    allowed_operations:
      - "read"
      - "query"
      - "admin"
      - "send"
    rate_limits:
      requests_per_minute: 15
      max_concurrent: 2

  analyst_agent:
    id: "analyst_agent"
    role: "analyst"
    description: "Coordinates multi-agent analysis workflows, queries databases, and delegates tasks"
    allowed_tools:
      - "read_file"
      - "run_query"
      - "call_api"
    allowed_resources:
      - "public/*"
      - "internal/*"
      - "doc:*"
      - "db:*"
      - "api:*"
    allowed_operations:
      - "read"
      - "query"
    rate_limits:
      requests_per_minute: 30
      max_concurrent: 5

  reader_agent:
    id: "reader_agent"
    role: "reader"
    description: "Specialist document reader restricted strictly to public documents"
    allowed_tools:
      - "read_file"
      - "call_api"
    allowed_resources:
      - "public/*"
      - "doc:public_report"
      - "api:*"
    allowed_operations:
      - "read"
    rate_limits:
      requests_per_minute: 30
      max_concurrent: 5

  mailer_agent:
    id: "mailer_agent"
    role: "mailer"
    description: "Outbound email and communications agent"
    allowed_tools:
      - "read_file"
      - "send_email"
      - "call_api"
    allowed_resources:
      - "public/*"
      - "internal/*"
      - "confidential/*"
      - "doc:*"
      - "email:outbound"
      - "api:*"
    allowed_operations:
      - "read"
      - "send"
    rate_limits:
      requests_per_minute: 20
      max_concurrent: 3

  research_agent:
    id: "research_agent"
    role: "research"
    description: "Reads and summarizes authorized documents"
    allowed_tools:
      - "read_file"
    allowed_resources:
      - "doc:*"
      - "public/*"
    allowed_operations:
      - "read"
    rate_limits:
      requests_per_minute: 30
      max_concurrent: 5

  sql_agent:
    id: "sql_agent"
    role: "sql"
    description: "Executes approved allowlisted SQL queries"
    allowed_tools:
      - "run_query"
    allowed_resources:
      - "db:analytics"
      - "db:reporting"
    allowed_operations:
      - "read"
      - "query"
    rate_limits:
      requests_per_minute: 20
      max_concurrent: 3

  email_agent:
    id: "email_agent"
    role: "email"
    description: "Sends emails subject to policy enforcement"
    allowed_tools:
      - "send_email"
      - "read_file"
    allowed_resources:
      - "doc:*"
      - "email:outbound"
    allowed_operations:
      - "read"
      - "send"
    rate_limits:
      requests_per_minute: 10
      max_concurrent: 2

# Global rate limits (apply to all agents)
global_rate_limits:
  requests_per_minute: 60
  max_concurrent: 10
  max_agent_loop_steps: 8
  max_request_duration_seconds: 60

# Approver registry
approvers:
  admin_user:
    id: "admin_user"
    role: "approver"
    # Secret hash (SHA-256 of "approve-secret-123" for demo)
    secret_hash: "becc9a320b50d8b7a06dc693777edd6844d0df6209e28c00c69cdba2907d679c"
    can_approve_for:
      - "email_agent"
      - "sql_agent"
      - "admin_agent"
      - "research_agent"
      - "analyst_agent"
      - "mailer_agent"

  security_officer:
    id: "security_officer"
    role: "security_approver"
    secret_hash: "becc9a320b50d8b7a06dc693777edd6844d0df6209e28c00c69cdba2907d679c"
    can_approve_for:
      - "admin_agent"
      - "email_agent"
      - "sql_agent"
      - "research_agent"
      - "mailer_agent"
